setup:
  addons:
    - plan: heroku-postgresql:essential-0
      as: DATABASE
    - plan: heroku-redis:mini
      as: REDIS
build:
  docker:
    web: backend/Dockerfile
    worker: backend/Dockerfile
release:
  command:
    - alembic upgrade head
  image: web
run:
  web: bash heroku_start.sh
  worker: celery -A app.celery_app.celery_app worker -l info --concurrency=1
